# Coordinator settings: the keys are the command-line options without the leading dashes.
# Start with: java -jar districompute-distributed-0.1.0-SNAPSHOT-all.jar coordinator --config coordinator.properties
# See docs/deployment.md. Keep this file readable only by the account that runs the coordinator (chmod 600),
# because it names the secret file and may hold the TLS key store password.

# Worker port (TCP). Open it in the firewall for the worker machines only.
bind=0.0.0.0
port=7650
# The cluster's shared secret (at least 16 bytes), in a file. Alternatively: DISTRICOMPUTE_SECRET.
secret-file=/etc/districompute/cluster.secret

# Scheduling policy for tasks that do not name one: round_robin, least_loaded, capability_aware,
# performance_aware or dynamic.
policy=dynamic
max-workers=64

# Failure detection (milliseconds).
heartbeat-interval-ms=2000
suspect-after-ms=5000
heartbeat-timeout-ms=10000

# TLS for the worker port (recommended on any network that is not fully trusted).
#tls-keystore=/etc/districompute/coordinator.p12
#tls-keystore-password=change-me

# HTTP API for the Application, operators and the submit/status/advise clients.
# Plain HTTP: bind it to 127.0.0.1, or to an internal interface behind a TLS reverse proxy.
http-port=8650
http-bind=127.0.0.1
http-token-file=/etc/districompute/api.token
#http-cors-origin=http://localhost:5173

# Only for fault-injection experiments: accept workers started with --fault-profile.
#allow-fault-simulation=true
