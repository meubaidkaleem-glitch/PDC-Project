# Worker settings: the keys are the command-line options without the leading dashes.
# Start with: java -Xmx2g -jar districompute-distributed-0.1.0-SNAPSHOT-all.jar worker --config worker.properties
# See docs/deployment.md and docs/worker-lifecycle.md.

coordinator=192.168.1.10:7650
# A stable id per machine: the coordinator keeps counters and performance history per id.
id=lab-pc-07
secret-file=/etc/districompute/cluster.secret

# Attempts executed at the same time (default: the number of processors).
max-concurrent-tasks=4
# Memory one attempt may use (default: 70 % of the heap divided by max-concurrent-tasks).
#max-task-memory-mb=400
# Free-form labels shown to the coordinator and the Application.
labels=room=lab-2,rack=b

# Offer only some Core algorithms (default: every algorithm that supports DISTRIBUTED_CPU).
#algorithms=primes.count,matrix.multiply,sort.merge

# TLS: a trust store containing the coordinator's certificate.
#tls-truststore=/etc/districompute/truststore.p12
#tls-truststore-password=change-me

# Graceful shutdown (SIGTERM): how long running attempts may take to finish.
drain-timeout-ms=30000
