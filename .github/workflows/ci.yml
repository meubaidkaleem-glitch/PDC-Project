name: Core CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, unit tests, concurrency tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven build (compile and package, tests skipped)
        run: ./mvnw -B -ntp -DskipTests package

      - name: Unit tests
        run: ./mvnw -B -ntp test

      - name: Concurrency tests
        run: ./mvnw -B -ntp test -Dtest.groups=concurrency -Dtest.excludedGroups=performance

      - name: Performance-scenario tests (correctness only, no timing assertions)
        run: ./mvnw -B -ntp test -Dtest.groups=performance -Dtest.excludedGroups=

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  code-quality:
    name: Code quality (Enforcer, Checkstyle, SpotBugs, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify (unit tests, coverage report, Checkstyle, SpotBugs)
        run: ./mvnw -B -ntp verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore
