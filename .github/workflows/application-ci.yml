name: Application CI

on:
  push:
    branches: [feature/application-gui, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Keep the built interface for the backend job
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  build-and-test:
    name: Build components and backend (with the interface), run backend tests
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out with the pinned component submodules
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Verify submodule pins
        run: scripts/bootstrap.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Core and Distributed from the submodules (their own quality gates)
        run: ./mvnw -B -ntp install -pl components/core,components/distributed/distributed -DskipTests

      - name: Download the built interface
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Backend build and tests (the jar serves the interface)
        run: ./mvnw -B -ntp verify -pl backend -Pwith-frontend

      - name: Check that the jar contains the interface
        # grep without -q reads all of its input, so unzip never gets SIGPIPE under pipefail.
        run: unzip -l backend/target/districompute-backend-*.jar | grep 'BOOT-INF/classes/static/index.html' > /dev/null

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports
          if-no-files-found: ignore

  e2e:
    name: End-to-end tests (interface, backend, MySQL, worker processes)
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Download the built interface
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Build the components (worker jar) and the backend jar with the interface
        run: |
          ./mvnw -B -ntp install -pl components/core,components/distributed/distributed -DskipTests
          ./mvnw -B -ntp package -pl backend -Pwith-frontend -DskipTests
      - name: Install Playwright and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: End-to-end tests (MySQL 8.4 in Docker, two worker processes)
        env:
          TMPDIR: ${{ runner.temp }}
        run: scripts/e2e.sh
      - name: Upload the Playwright report and the backend and worker logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
            ${{ runner.temp }}/districompute-e2e.*/logs
          if-no-files-found: ignore

  docker:
    name: Docker images and Compose smoke test
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Download the built interface
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Build the jars the images package
        run: |
          ./mvnw -B -ntp install -pl components/core,components/distributed/distributed -DskipTests
          ./mvnw -B -ntp package -pl backend -Pwith-frontend -DskipTests
      - name: Compose smoke test (MySQL, application, two workers, one distributed experiment)
        env:
          TMPDIR: ${{ runner.temp }}
        run: scripts/compose-smoke.sh
      - name: Upload the Compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: ${{ runner.temp }}/districompute-compose.*/compose.log
          if-no-files-found: ignore

  component-tests:
    name: Component test suites at the pinned commits
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Core and Distributed tests (default groups)
        run: ./mvnw -B -ntp install -pl components/core,components/distributed/distributed
