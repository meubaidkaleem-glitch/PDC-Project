# DistriCompute application backend. Every value can be overridden by an environment variable
# (for example DISTRICOMPUTE_DB_URL); see docs/deployment.md.
spring:
  application:
    name: districompute
  datasource:
    url: ${DISTRICOMPUTE_DB_URL:jdbc:mysql://localhost:3306/districompute}
    username: ${DISTRICOMPUTE_DB_USER:districompute}
    password: ${DISTRICOMPUTE_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${DISTRICOMPUTE_HTTP_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
