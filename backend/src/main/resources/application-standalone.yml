# Standalone mode (docs/standalone.md): everything in one process for a single computer. An embedded H2 database
# in the data directory replaces MySQL, two workers run inside the application, the interface opens in the browser,
# the fault lab is available, and nothing listens beyond this computer. Used by the Windows and Linux packages.
spring:
  datasource:
    url: jdbc:h2:file:${districompute.data-dir:./data}/database/districompute;MODE=MySQL;DATABASE_TO_LOWER=TRUE;LOCK_TIMEOUT=10000
    username: districompute
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    locations: classpath:db/migration-h2

server:
  address: 127.0.0.1

districompute:
  coordinator:
    bind-address: 127.0.0.1
  standalone:
    local-workers: 2
    open-browser: true
  # The fault lab runs its simulated workers on an isolated coordinator inside this process (docs/fault-lab.md);
  # on a single computer there is no cluster it could disturb.
  faults:
    enabled: true
