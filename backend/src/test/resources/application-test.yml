# Settings for integration tests (profile "test"): ephemeral worker port, fast heartbeats, quiet logs.
districompute:
  coordinator:
    bind-address: 127.0.0.1
    port: 0
    heartbeat-interval: 200ms
    suspect-after: 800ms
    heartbeat-timeout: 3s
  faults:
    enabled: true
  # The tests start their own worker nodes and never open a browser, also with the standalone profile.
  standalone:
    local-workers: 0
    open-browser: false
    show-sign-in: false
  limits:
    submissions-per-minute: 200
    max-active-experiments-per-user: 20
logging:
  level:
    org.districompute: INFO
    org.hibernate.SQL: WARN
